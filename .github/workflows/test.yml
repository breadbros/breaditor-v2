on: ['push', 'pull_request']

name: Test
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn tsc --noEmit

      - name: Build
        run: yarn pre-build

      - name: Test
        run: |
          yarn pre-test
          yarn test
